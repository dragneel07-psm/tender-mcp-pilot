services:
  - type: web
    name: nepal-tender-notice-monitor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 app.py serve
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /opt/render/project/src/storage
      - key: AUTO_COLLECT_INTERVAL_MINUTES
        value: 60
    disk:
      name: tender-monitor-data
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
